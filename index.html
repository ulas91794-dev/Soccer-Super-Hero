<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Soccer Star Engine</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0f4a25;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;

    background:
    linear-gradient(rgba(255,255,255,0.05) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 2px, transparent 2px),
    #167a3c;

    background-size:80px 80px;

    touch-action:none;
}

.ui{
    position:fixed;
    top:20px;
    left:20px;

    color:white;
    z-index:20;

    user-select:none;
    text-shadow:0 2px 5px rgba(0,0,0,0.5);
}

.ui h1{
    font-size:28px;
    margin-bottom:10px;
}

.stat{
    margin-top:5px;
    font-size:20px;
}

.overlay{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,0.8);

    z-index:100;
}

.menu-box{

    background:#1a1a1a;

    padding:40px;

    border-radius:20px;

    width:600px;

    text-align:center;

    color:white;
}

.team-btn{

    margin-top:15px;

    padding:18px;

    border:none;

    border-radius:14px;

    width:100%;

    font-size:20px;

    color:white;

    cursor:pointer;

    transition:0.2s;
}

.team-btn:hover{

    transform:scale(1.03);
}

.hidden{
    display:none;
}

.newspaper{

    position:fixed;

    inset:0;

    background:#f1e6c8;

    color:#111;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    z-index:200;

    font-family:Georgia,serif;

    text-align:center;
}

.newspaper h1{

    font-size:60px;

    margin-bottom:20px;
}

.newspaper p{

    font-size:28px;

    width:70%;
}

</style>
</head>
<body>

<div class="ui">

    <h1>⚽ Ultimate Soccer Star</h1>

    <div class="stat" id="levelText">Level: 1</div>
    <div class="stat" id="scoreText">Score: 0</div>
    <div class="stat" id="highScoreText">High Score: 0</div>

</div>

<div id="menuOverlay" class="overlay">

    <div class="menu-box">

        <h1>Select Your Team</h1>

        <button class="team-btn"
        style="background:#ff4040"
        onclick="selectTeam(0)">
        🔴 Red Tigers
        </button>

        <button class="team-btn"
        style="background:#4090ff"
        onclick="selectTeam(1)">
        🔵 Blue Sharks
        </button>

        <button class="team-btn"
        style="background:#ffd000;color:black"
        onclick="selectTeam(2)">
        🟡 Golden Eagles
        </button>

    </div>

</div>

<div id="newspaperOverlay"
class="newspaper hidden">

    <h1 id="headline"></h1>

    <p>
    Fans are talking about this legendary goal all night long.
    </p>

</div>

<canvas id="gameCanvas"></canvas>

<script>

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

function resizeCanvas(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;

    loadLevel(currentLevel);
}

window.addEventListener("resize",resizeCanvas);

const levelText =
document.getElementById("levelText");

const scoreText =
document.getElementById("scoreText");

const highScoreText =
document.getElementById("highScoreText");

const menuOverlay =
document.getElementById("menuOverlay");

const newspaperOverlay =
document.getElementById("newspaperOverlay");

const headlineEl =
document.getElementById("headline");

const teams = [

{
    name:"Red Tigers",
    color:"#ff4040",
    power:1.15,
    keeperDifficulty:1
},

{
    name:"Blue Sharks",
    color:"#4090ff",
    power:1,
    keeperDifficulty:1.3
},

{
    name:"Golden Eagles",
    color:"#ffd000",
    power:0.92,
    keeperDifficulty:1.6
}

];

let selectedTeam = null;

const headlines = [

"Star Player Steals The Show!",
"Goalkeepers Can't Stop Him!",
"Goal Of The Year!",
"Fans Go Wild After Miracle Shot!",
"Football History Was Made Tonight!"

];

let gameState = "MENU";

let currentLevel = 0;
let score = 0;

let highScore =
parseInt(localStorage.getItem("soccerHighScore")) || 0;

let lastTime = 0;
let deltaTime = 1;

let goalScored = false;
let goalTimer = 0;

const stats = {

    goals:0,
    shots:0,
    score:0
};

const levels = [

{
    goal:{x:0,y:0,width:70,height:200},

    obstacles:[]
},

{
    goal:{x:0,y:0,width:70,height:180},

    obstacles:[
        {x:500,y:220,width:40,height:200}
    ]
},

{
    goal:{x:0,y:0,width:70,height:150},

    obstacles:[
        {x:450,y:120,width:40,height:160},
        {x:650,y:340,width:40,height:160}
    ]
}

];

const ball = {

    x:220,
    y:300,

    radius:22,

    vx:0,
    vy:0,

    spinX:0,
    spinY:0,

    friction:0.985,

    moving:false,

    trail:[]
};

const goalkeeper = {

    x:0,
    y:0,

    width:70,
    height:20,

    speed:3,

    direction:1
};

const particles = [];

let isDragging = false;

let dragStart = {x:0,y:0};

let currentPointer = {x:0,y:0};

let lastSwipePos = null;

const audioCtx =
new(window.AudioContext ||
window.webkitAudioContext)();

function initAudio(){

    audioCtx.resume();

    playSound(1,0.01);
}

window.addEventListener(
"pointerdown",
initAudio,
{once:true}
);

function playSound(freq,duration,type="sine"){

    const osc =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    osc.type = type;

    osc.frequency.value = freq;

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    gain.gain.setValueAtTime(
        0.1,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime + duration
    );
}

function clamp(value,min,max){

    return Math.max(min,Math.min(max,value));
}

function distance(x1,y1,x2,y2){

    return Math.hypot(x2-x1,y2-y1);
}

function selectTeam(index){

    selectedTeam = teams[index];

    menuOverlay.classList.add("hidden");

    gameState = "PLAYING";

    resizeCanvas();

    updateUI();
}

function loadLevel(index){

    const level = levels[index];

    level.goal.x =
    canvas.width - 120;

    level.goal.y =
    canvas.height/2 -
    level.goal.height/2;

    goalkeeper.x =
    level.goal.x - 10;

    goalkeeper.y =
    level.goal.y +
    level.goal.height/2;

    goalkeeper.speed =
    3 * selectedTeam.keeperDifficulty;

    resetBall();
}

function resetBall(){

    ball.x = 220;
    ball.y = canvas.height/2;

    ball.vx = 0;
    ball.vy = 0;

    ball.spinX = 0;
    ball.spinY = 0;

    ball.moving = false;

    ball.trail = [];
}

function updateUI(){

    levelText.innerText =
    `Level: ${currentLevel + 1}`;

    scoreText.innerText =
    `Score: ${score}`;

    highScoreText.innerText =
    `High Score: ${highScore}`;
}

function getPointerPosition(e){

    const rect =
    canvas.getBoundingClientRect();

    if(e.touches){

        return{

            x:e.touches[0].clientX -
            rect.left,

            y:e.touches[0].clientY -
            rect.top
        };
    }

    return{

        x:e.clientX - rect.left,
        y:e.clientY - rect.top
    };
}function spawnParticles(x,y,color,amount=20){

    for(let i=0;i<amount;i++){

        particles.push({

            x,
            y,

            vx:(Math.random()-0.5)*8,
            vy:(Math.random()-0.5)*8,

            size:Math.random()*6 + 2,

            life:60,

            color
        });
    }
}

function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p = particles[i];

        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= Math.pow(0.96,dt);
        p.vy *= Math.pow(0.96,dt);

        p.life -= dt;

        if(p.life <= 0){

            particles.splice(i,1);
        }
    }
}

function drawParticles(){

    particles.forEach(p=>{

        ctx.globalAlpha = p.life / 60;

        ctx.fillStyle = p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    ctx.globalAlpha = 1;
}

function startDrag(e){

    if(gameState !== "PLAYING") return;

    const pos =
    getPointerPosition(e);

    if(ball.moving){

        lastSwipePos = pos;
        return;
    }

    if(distance(
        pos.x,
        pos.y,
        ball.x,
        ball.y
    ) <= ball.radius){

        isDragging = true;

        dragStart.x = ball.x;
        dragStart.y = ball.y;

        currentPointer = pos;
    }
}

function moveDrag(e){

    const pos =
    getPointerPosition(e);

    if(isDragging){

        currentPointer = pos;
    }

    if(ball.moving && lastSwipePos){

        const dx =
        pos.x - lastSwipePos.x;

        const dy =
        pos.y - lastSwipePos.y;

        ball.spinX += dx * 0.002;
        ball.spinY += dy * 0.002;

        lastSwipePos = pos;
    }
}

function endDrag(){

    lastSwipePos = null;

    if(!isDragging) return;

    isDragging = false;

    let dx =
    dragStart.x - currentPointer.x;

    let dy =
    dragStart.y - currentPointer.y;

    const maxDrag = 180;

    const dist =
    Math.hypot(dx,dy);

    if(dist > maxDrag){

        const angle =
        Math.atan2(dy,dx);

        dx =
        Math.cos(angle) * maxDrag;

        dy =
        Math.sin(angle) * maxDrag;
    }

    const power =
    0.16 * selectedTeam.power;

    ball.vx = dx * power;
    ball.vy = dy * power;

    ball.moving = true;

    stats.shots++;

    playSound(240,0.08,"square");
}

canvas.addEventListener(
"mousedown",
startDrag
);

canvas.addEventListener(
"mousemove",
moveDrag
);

window.addEventListener(
"mouseup",
endDrag
);

function physicsStep(dt){

    ball.vx += ball.spinX * dt;
    ball.vy += ball.spinY * dt;

    ball.spinX *= Math.pow(0.98,dt);
    ball.spinY *= Math.pow(0.98,dt);

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    ball.vx *= Math.pow(ball.friction,dt);
    ball.vy *= Math.pow(ball.friction,dt);

    if(Math.abs(ball.vx) < 0.03)
    ball.vx = 0;

    if(Math.abs(ball.vy) < 0.03)
    ball.vy = 0;

    if(ball.vx === 0 &&
       ball.vy === 0){

        ball.moving = false;
    }

    if(ball.x - ball.radius < 0){

        ball.x = ball.radius;

        ball.vx *= -0.85;
    }

    if(ball.x + ball.radius >
       canvas.width){

        ball.x =
        canvas.width - ball.radius;

        ball.vx *= -0.85;
    }

    if(ball.y - ball.radius < 0){

        ball.y = ball.radius;

        ball.vy *= -0.85;
    }

    if(ball.y + ball.radius >
       canvas.height){

        ball.y =
        canvas.height - ball.radius;

        ball.vy *= -0.85;
    }

    goalkeeper.x +=
    goalkeeper.speed *
    goalkeeper.direction *
    dt;

    const goal =
    levels[currentLevel].goal;

    const minX = goal.x - 40;

    const maxX =
    goal.x + goal.width -
    goalkeeper.width + 40;

    if(goalkeeper.x < minX ||
       goalkeeper.x > maxX){

        goalkeeper.direction *= -1;
    }

    goalkeeperCollision();

    obstacleCollision();

    checkGoal();

    ball.trail.push({

        x:ball.x,
        y:ball.y
    });

    if(ball.trail.length > 18){

        ball.trail.shift();
    }
}

function goalkeeperCollision(){

    const closestX = clamp(
        ball.x,
        goalkeeper.x,
        goalkeeper.x + goalkeeper.width
    );

    const closestY = clamp(
        ball.y,
        goalkeeper.y,
        goalkeeper.y + goalkeeper.height
    );

    const dx = ball.x - closestX;
    const dy = ball.y - closestY;

    const dist =
    Math.hypot(dx,dy);

    if(dist < ball.radius){

        const normalX = dx / dist;
        const normalY = dy / dist;

        const overlap =
        ball.radius - dist;

        // POSITION CORRECTION

        ball.x += normalX * overlap;
        ball.y += normalY * overlap;

        const keeperMomentum =
        goalkeeper.speed *
        goalkeeper.direction;

        ball.vx +=
        normalX * 5 +
        keeperMomentum * 0.7;

        ball.vy +=
        normalY * 5;

        spawnParticles(
            ball.x,
            ball.y,
            "#ffcc00",
            25
        );

        playSound(120,0.06,"sawtooth");
    }
}

function obstacleCollision(){

    const level =
    levels[currentLevel];

    level.obstacles.forEach(o=>{

        const closestX = clamp(
            ball.x,
            o.x,
            o.x + o.width
        );

        const closestY = clamp(
            ball.y,
            o.y,
            o.y + o.height
        );

        const dx =
        ball.x - closestX;

        const dy =
        ball.y - closestY;

        const dist =
        Math.hypot(dx,dy);

        if(dist < ball.radius){

            const normalX = dx / dist;
            const normalY = dy / dist;

            const overlap =
            ball.radius - dist;

            ball.x += normalX * overlap;
            ball.y += normalY * overlap;

            ball.vx += normalX * 5;
            ball.vy += normalY * 5;

            spawnParticles(
                ball.x,
                ball.y,
                "#ffffff",
                10
            );
        }
    });
}

function checkGoal(){

    if(goalScored) return;

    const goal =
    levels[currentLevel].goal;

    const insideGoal =

    ball.x + ball.radius > goal.x &&
    ball.x - ball.radius < goal.x + goal.width &&
    ball.y + ball.radius > goal.y &&
    ball.y - ball.radius < goal.y + goal.height;

    if(insideGoal){

        goalScored = true;

        goalTimer = 120;

        stats.goals++;

        score += 100;

        stats.score = score;

        if(score > highScore){

            highScore = score;

            localStorage.setItem(
                "soccerHighScore",
                highScore
            );
        }

        spawnParticles(
            ball.x,
            ball.y,
            "#ffd700",
            80
        );

        playSound(520,0.2,"square");

        updateUI();
    }
}

function nextLevel(){

    currentLevel++;

    if(currentLevel >= levels.length){

        showResults();

        return;
    }

    if(currentLevel % 2 === 0){

        showNewspaper();

        return;
    }

    loadLevel(currentLevel);
}

function showNewspaper(){

    gameState = "NEWSPAPER";

    headlineEl.innerText =

    headlines[
        Math.floor(
            Math.random() *
            headlines.length
        )
    ];

    newspaperOverlay
    .classList
    .remove("hidden");

    setTimeout(()=>{

        newspaperOverlay
        .classList
        .add("hidden");

        gameState = "PLAYING";

        loadLevel(currentLevel);

    },3000);
}

function showResults(){

    gameState = "RESULTS";

    const efficiency =
    (
        stats.goals /
        Math.max(1,stats.shots)
    ).toFixed(2);

    alert(
`SEASON COMPLETE!

Golden Boot 🏆
Goals: ${stats.goals}

Best Scorer ⭐
Score: ${score}

MVP Efficiency:
${efficiency}`
    );

    location.reload();
}

function drawField(){

    ctx.strokeStyle =
    "rgba(255,255,255,0.15)";

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(
        canvas.width/2,
        0
    );

    ctx.lineTo(
        canvas.width/2,
        canvas.height
    );

    ctx.stroke();
}

function drawGoal(){

    const goal =
    levels[currentLevel].goal;

    ctx.strokeStyle = "#fff";

    ctx.lineWidth = 5;

    ctx.strokeRect(
        goal.x,
        goal.y,
        goal.width,
        goal.height
    );
}

function drawGoalkeeper(){

    ctx.fillStyle =
    selectedTeam.color;

    ctx.fillRect(
        goalkeeper.x,
        goalkeeper.y,
        goalkeeper.width,
        goalkeeper.height
    );
}

function drawObstacles(){

    levels[currentLevel]
    .obstacles
    .forEach(o=>{

        ctx.fillStyle = "#333";

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );
    });
}

function drawTrail(){

    for(let i=0;i<ball.trail.length;i++){

        const t = ball.trail[i];

        const alpha =
        i / ball.trail.length;

        ctx.beginPath();

        ctx.arc(
            t.x,
            t.y,
            ball.radius *
            alpha * 0.9,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        `rgba(255,255,255,
        ${alpha*0.18})`;

        ctx.fill();
    }
}

function drawBall(){

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle = "#fff";

    ctx.fill();
}

function drawGoalText(){

    if(!goalScored) return;

    goalTimer--;

    ctx.font =
    "bold 72px Arial";

    ctx.textAlign = "center";

    ctx.fillStyle = "#fff";

    ctx.fillText(
        "GOAL!",
        canvas.width/2,
        120
    );

    if(goalTimer <= 0){

        goalScored = false;

        nextLevel();
    }
}

function updateGameplay(dt){

    // SUBSTEPPING

    const subSteps = 5;

    for(let i=0;i<subSteps;i++){

        physicsStep(
            dt / subSteps
        );
    }

    updateParticles(dt);
}

function drawGameplay(){

    drawField();

    drawGoal();

    drawGoalkeeper();

    drawObstacles();

    drawTrail();

    drawParticles();

    drawBall();

    drawGoalText();
}

function updateDeltaTime(timestamp){

    deltaTime =
    (timestamp - lastTime)
    / 16.666;

    lastTime = timestamp;
}

function gameLoop(timestamp){

    updateDeltaTime(timestamp);

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    switch(gameState){

        case "PLAYING":

            updateGameplay(deltaTime);

            drawGameplay();

        break;
    }

    requestAnimationFrame(gameLoop);
}

resizeCanvas();

updateUI();

gameLoop();

</script>
</body>
</html>
